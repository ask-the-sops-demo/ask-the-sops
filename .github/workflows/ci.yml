# Gate 2: runs on every pull request and every push to main.
# The job name "build-and-test" is the status check that the ruleset on main requires.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and check coverage
        run: mvn -B verify
      - name: Smoke test
        run: ./scripts/smoke-test.sh
